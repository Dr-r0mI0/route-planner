version: '3.8'

services:
  rout-planner-dev:
    image: node:20-alpine
    container_name: rout-planner-dev
    working_dir: /app
    volumes:
      - .:/app
    # We use a command that installs concurrently (if missing) and runs the dev:all script
    command: sh -c "npm install && npm run dev:all"
    ports:
      - "5173:5173"
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - CHOKIDAR_USEPOLLING=true
